version: '3.9'

services:
  frontend:
    # GHCR 近版无公开 semver，默认钉 digest；可用 FRONTEND_IMAGE 覆盖
    image: ${FRONTEND_IMAGE:-ghcr.io/blockscout/frontend@sha256:4b69f44148414b55c6b8550bc3270c63c9f99e923d54ef0b307e762af6bac90a}
    pull_policy: missing
    platform: linux/amd64
    restart: always
    container_name: 'frontend'
    env_file:
      -  ../envs/common-frontend.env
